name: CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPO: fullstack-devops-deployment
  ECR_REGISTRY: 786769475575.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout
      uses: actions/checkout@v3

    # 2️⃣ Configure AWS
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 3️⃣ Login to ECR
    - name: Login to ECR
      run: |
        aws ecr get-login-password --region $AWS_REGION \
        | docker login --username AWS --password-stdin $ECR_REGISTRY

    # 4️⃣ Build Docker image
    - name: Build Docker Image
      run: |
        docker build -t $ECR_REPO ./app
        docker tag $ECR_REPO:latest $ECR_REGISTRY/$ECR_REPO:latest

    # 5️⃣ Push to ECR
    - name: Push to ECR
      run: |
        docker push $ECR_REGISTRY/$ECR_REPO:latest

    # 6️⃣ Deploy to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}   # ✅ Use Elastic IP
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e

          echo "Stopping old container..."
          docker stop app || true
          docker rm app || true

          echo "Login to ECR..."
          aws ecr get-login-password --region ap-south-1 \
          | docker login --username AWS --password-stdin 786769475575.dkr.ecr.ap-south-1.amazonaws.com

          echo "Pull latest image..."
          docker pull 786769475575.dkr.ecr.ap-south-1.amazonaws.com/fullstack-devops-deployment:latest

          echo "Run container..."
          docker run -d --restart=always -p 80:5000 --name app \
          786769475575.dkr.ecr.ap-south-1.amazonaws.com/fullstack-devops-deployment:latest

          echo "Container status:"
          docker ps -a

          echo "Application logs:"
          docker logs app

          echo "Health check:"
          curl -I http://localhost || echo "App not responding"
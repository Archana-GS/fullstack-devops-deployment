name: CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPO: fullstack-devops-deployment
  ECR_REGISTRY: 786769475575.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout
      uses: actions/checkout@v3

    # 2. Configure AWS credentials
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 3. Login to ECR
    - name: Login to ECR
      run: |
        aws ecr get-login-password --region $AWS_REGION \
        | docker login --username AWS --password-stdin $ECR_REGISTRY

    # 4. Build Docker image
    - name: Build Docker Image
      run: |
        docker build -t $ECR_REPO ./app
        docker tag $ECR_REPO:latest $ECR_REGISTRY/$ECR_REPO:latest

    # 5. Push image to ECR
    - name: Push to ECR
      run: |
        docker push $ECR_REGISTRY/$ECR_REPO:latest

    # 6. Deploy to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}   # Elastic IP (IMPORTANT)
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e

          echo "Stopping old container..."
          docker stop app || true
          docker rm app || true

          echo "Logging into ECR..."
          aws ecr get-login-password --region ap-south-1 \
          | docker login --username AWS --password-stdin $ECR_REGISTRY

          echo "Pulling latest image..."
          docker pull $ECR_REGISTRY/$ECR_REPO:latest

          echo "Starting new container..."
          docker run -d --restart=always -p 80:5000 --name app $ECR_REGISTRY/$ECR_REPO:latest

          echo "Container status:"
          docker ps -a

          echo "Application logs:"
          docker logs app

          echo "Health check:"
          curl -I http://localhost || echo "App not responding"